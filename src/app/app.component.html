<!-- Titan Elite Premium Brand Layout -->
<app-navbar></app-navbar>

<main class="bg-dark min-h-screen text-white relative">
  <!-- Hero Section -->
  <app-hero></app-hero>

  <!-- Scrolling Trust Marquee -->
  <app-stats-bar></app-stats-bar>

  <!-- Features / Offerings -->
  <app-features></app-features>

  <!-- Onboarding Methodology -->
  <app-enrollment></app-enrollment>

  <!-- Membership Pricing -->
  <app-pricing></app-pricing>

  <!-- Success Stories / Testimonials -->
  <app-testimonials></app-testimonials>

  <!-- Facility Tour -->
  <app-facility></app-facility>

  <!-- FAQ -->
  <app-faq></app-faq>

  <!-- Pre-footer CTA Conversion Banner -->
  <app-cta-banner></app-cta-banner>
</main>

<app-footer></app-footer>

<!-- Mobile Sticky CTA Bar (Fixed Bottom, Mobile Only) -->
<div class="fixed bottom-0 left-0 w-full md:hidden bg-dark/97 backdrop-blur-xl px-5 py-3 border-t border-white/10 z-40 flex items-center justify-between shadow-2xl">
  <div class="text-left font-inter">
    <span class="text-[9px] font-black uppercase tracking-widest text-gold block">Titan Protocol</span>
    <span class="text-xs text-white font-black block">Limited June Slots</span>
  </div>
  <button
    (click)="openModal()"
    class="px-5 py-2.5 rounded-full bg-gold hover:bg-gold-hover text-dark font-black tracking-wider text-[10px] uppercase shadow-md shadow-gold/20 transition-all duration-300 glow-gold-btn"
  >
    Apply Now
  </button>
</div>

<!-- Multi-Step Application Modal -->
@if (isModalOpen()) {
  <app-modal></app-modal>
}

<router-outlet></router-outlet>
