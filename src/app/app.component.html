<!-- Titan Elite Premium Brand Layout -->
<app-navbar></app-navbar>

<main class="bg-dark min-h-screen text-white relative">
  <!-- Dynamic Conversion Flow -->
  <app-hero></app-hero>
  <app-features></app-features>
  <app-enrollment></app-enrollment>
  <app-pricing></app-pricing>
  <app-faq></app-faq>
  <app-testimonials></app-testimonials>
</main>

<app-footer></app-footer>

<!-- Mobile Sticky CTA Bar (Fixed Bottom, Mobile Only) -->
<div class="fixed bottom-0 left-0 w-full md:hidden bg-dark/95 backdrop-blur-md px-5 py-4 border-t border-white/10 z-40 flex items-center justify-between shadow-2xl">
  <div class="text-left font-inter">
    <span class="text-[9px] font-black uppercase tracking-widest text-gold block">Titan Protocol</span>
    <span class="text-xs text-white font-black block">Limited June Slots</span>
  </div>
  <button 
    (click)="openModal()" 
    class="px-5 py-3 rounded-full bg-gold hover:bg-gold-hover text-dark font-black tracking-wider text-[10px] uppercase shadow-md shadow-gold/20"
  >
    Apply Now
  </button>
</div>

<!-- Multi-Step Exclusive Application Modal Overlay -->
@if (isModalOpen()) {
  <app-modal></app-modal>
}

<!-- Router Outlet for future structural expansions -->
<router-outlet></router-outlet>
