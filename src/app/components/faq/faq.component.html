<section id="faq" class="py-24 sm:py-32 relative bg-dark overflow-hidden">
  <!-- Decorative background glow -->
  <div class="absolute bottom-0 right-10 w-96 h-96 bg-gold/5 rounded-full filter blur-[120px] pointer-events-none select-none"></div>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
    <!-- Header with breathing room -->
    <div class="text-center mb-20">
      <span class="text-xs font-bold tracking-widest text-gold uppercase font-inter block mb-4">FAQ</span>
      <h2 class="text-3xl sm:text-5xl font-black font-outfit text-white uppercase tracking-tight mb-6">
        Membership Protocols FAQ
      </h2>
      <div class="w-20 h-1 bg-gold mx-auto mb-6"></div>
      <p class="text-gray-400 font-inter font-light text-base sm:text-lg">
        Answers to essential inquiries about our premium facilities, diagnostic testing, and vip policies.
      </p>
    </div>

    <!-- Accordion Accord List -->
    <div class="space-y-6 font-inter">
      @for (faq of faqList; track faq.id) {
        <div 
          class="glass-card rounded-2xl border transition-all duration-300"
          [class.border-gold/30]="activeFaqId() === faq.id"
          [class.border-white/5]="activeFaqId() !== faq.id"
        >
          <!-- Toggle Button -->
          <button 
            type="button" 
            (click)="toggleFaq(faq.id)"
            class="w-full px-6 py-5 sm:py-6 flex items-center justify-between text-left focus:outline-none"
            [attr.aria-expanded]="activeFaqId() === faq.id"
          >
            <span 
              class="text-base sm:text-lg font-bold font-outfit uppercase tracking-wide transition-colors duration-300"
              [class.text-gold]="activeFaqId() === faq.id"
              [class.text-white]="activeFaqId() !== faq.id"
            >
              {{ faq.question }}
            </span>
            <!-- Plus/Minus Arrow Icon -->
            <svg 
              class="w-5 h-5 text-gray-400 transform transition-transform duration-300 flex-shrink-0 ml-4"
              [class.rotate-45]="activeFaqId() === faq.id"
              [class.text-gold]="activeFaqId() === faq.id"
              fill="none" 
              viewBox="0 0 24 24" 
              stroke="currentColor" 
              stroke-width="2.5"
            >
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg>
          </button>

          <!-- Answer Panel -->
          <div 
            class="overflow-hidden transition-all duration-300 ease-in-out"
            [class.max-h-[300px]]="activeFaqId() === faq.id"
            [class.max-h-0]="activeFaqId() !== faq.id"
          >
            <div class="px-6 pb-6 text-sm sm:text-base text-gray-400 font-light leading-relaxed border-t border-white/5 pt-4">
              <p>{{ faq.answer }}</p>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
