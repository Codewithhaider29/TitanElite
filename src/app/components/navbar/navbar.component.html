<header
  class="fixed top-0 left-0 w-full z-50 transition-all duration-500"
  [class.glass-nav]="!isScrolled()"
  [class.glass-nav-scrolled]="isScrolled()"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16 sm:h-20">

      <!-- Logo -->
      <div
        class="flex-shrink-0 flex items-center cursor-pointer select-none"
        (click)="scrollToSection('hero')"
      >
        <span class="text-xl sm:text-2xl font-black font-outfit tracking-widest text-white">
          TITAN<span class="text-gold text-glow-gold">ELITE</span>
        </span>
      </div>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center space-x-8 font-inter text-sm font-semibold tracking-wide">
        <a (click)="scrollToSection('features')" class="text-gray-300 hover:text-gold cursor-pointer transition-colors duration-300 relative py-2 group">
          Offerings
          <span class="absolute bottom-0 left-0 w-0 h-px bg-gold transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a (click)="scrollToSection('enrollment')" class="text-gray-300 hover:text-gold cursor-pointer transition-colors duration-300 relative py-2 group">
          Methodology
          <span class="absolute bottom-0 left-0 w-0 h-px bg-gold transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a (click)="scrollToSection('pricing')" class="text-gray-300 hover:text-gold cursor-pointer transition-colors duration-300 relative py-2 group">
          Memberships
          <span class="absolute bottom-0 left-0 w-0 h-px bg-gold transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a (click)="scrollToSection('testimonials')" class="text-gray-300 hover:text-gold cursor-pointer transition-colors duration-300 relative py-2 group">
          Stories
          <span class="absolute bottom-0 left-0 w-0 h-px bg-gold transition-all duration-300 group-hover:w-full"></span>
        </a>
        <a (click)="scrollToSection('facility')" class="text-gray-300 hover:text-gold cursor-pointer transition-colors duration-300 relative py-2 group">
          Facility
          <span class="absolute bottom-0 left-0 w-0 h-px bg-gold transition-all duration-300 group-hover:w-full"></span>
        </a>
      </nav>

      <!-- Desktop CTA -->
      <div class="hidden md:flex items-center">
        <button
          (click)="openApplicationModal()"
          class="px-6 py-2.5 rounded-full bg-gold hover:bg-gold-hover text-dark font-black tracking-wider text-xs uppercase shadow-lg shadow-gold/20 transition-all duration-300 hover:-translate-y-0.5 glow-gold-btn"
        >
          Join the Elite
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <button
        (click)="toggleMenu()"
        type="button"
        class="md:hidden relative w-10 h-10 flex flex-col items-center justify-center gap-1.5 focus:outline-none z-[70]"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle menu"
      >
        <span
          class="block w-6 h-0.5 bg-white transition-all duration-400 origin-center"
          [class.rotate-45]="isMenuOpen()"
          [class.translate-y-2]="isMenuOpen()"
        ></span>
        <span
          class="block w-6 h-0.5 bg-white transition-all duration-300"
          [class.opacity-0]="isMenuOpen()"
          [class.scale-x-0]="isMenuOpen()"
        ></span>
        <span
          class="block w-6 h-0.5 bg-white transition-all duration-400 origin-center"
          [class.-rotate-45]="isMenuOpen()"
          [class.-translate-y-2]="isMenuOpen()"
        ></span>
      </button>
    </div>
  </div>
</header>

<!-- Full-Screen Mobile Menu Overlay -->
<div
  class="mobile-menu-overlay md:hidden"
  [class.open]="isMenuOpen()"
  role="dialog"
  aria-modal="true"
>
  <!-- Decorative ambient glow blobs -->
  <div class="absolute top-1/4 right-0 w-64 h-64 bg-gold/5 rounded-full filter blur-[100px] pointer-events-none"></div>
  <div class="absolute bottom-1/4 left-0 w-48 h-48 bg-gold/3 rounded-full filter blur-[80px] pointer-events-none"></div>

  <div class="relative z-10 flex flex-col h-full px-6 pt-24 pb-10">

    <!-- Brand Mark -->
    <div class="mb-10">
      <span class="text-3xl font-black font-outfit tracking-widest text-white">
        TITAN<span class="text-gold text-glow-gold">ELITE</span>
      </span>
      <p class="text-xs text-gray-500 font-inter mt-1 tracking-widest uppercase">Premium Athletic Sanctuary</p>
    </div>

    <!-- Navigation Links -->
    <nav class="flex flex-col gap-1 mb-auto">
      <a
        (click)="scrollToSection('features')"
        class="group flex items-center justify-between py-4 border-b border-white/5 cursor-pointer transition-all duration-300"
      >
        <span class="text-2xl font-black font-outfit text-white group-hover:text-gold transition-colors duration-300 uppercase tracking-wide">Offerings</span>
        <svg class="w-5 h-5 text-gray-600 group-hover:text-gold group-hover:translate-x-1 transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
      <a
        (click)="scrollToSection('enrollment')"
        class="group flex items-center justify-between py-4 border-b border-white/5 cursor-pointer transition-all duration-300"
      >
        <span class="text-2xl font-black font-outfit text-white group-hover:text-gold transition-colors duration-300 uppercase tracking-wide">Methodology</span>
        <svg class="w-5 h-5 text-gray-600 group-hover:text-gold group-hover:translate-x-1 transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
      <a
        (click)="scrollToSection('pricing')"
        class="group flex items-center justify-between py-4 border-b border-white/5 cursor-pointer transition-all duration-300"
      >
        <span class="text-2xl font-black font-outfit text-white group-hover:text-gold transition-colors duration-300 uppercase tracking-wide">Memberships</span>
        <svg class="w-5 h-5 text-gray-600 group-hover:text-gold group-hover:translate-x-1 transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
      <a
        (click)="scrollToSection('testimonials')"
        class="group flex items-center justify-between py-4 border-b border-white/5 cursor-pointer transition-all duration-300"
      >
        <span class="text-2xl font-black font-outfit text-white group-hover:text-gold transition-colors duration-300 uppercase tracking-wide">Success Stories</span>
        <svg class="w-5 h-5 text-gray-600 group-hover:text-gold group-hover:translate-x-1 transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
      <a
        (click)="scrollToSection('facility')"
        class="group flex items-center justify-between py-4 border-b border-white/5 cursor-pointer transition-all duration-300"
      >
        <span class="text-2xl font-black font-outfit text-white group-hover:text-gold transition-colors duration-300 uppercase tracking-wide">Facility</span>
        <svg class="w-5 h-5 text-gray-600 group-hover:text-gold group-hover:translate-x-1 transition-all duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
        </svg>
      </a>
    </nav>

    <!-- Mobile CTA -->
    <div class="mt-10 flex flex-col gap-3">
      <button
        (click)="openApplicationModal()"
        class="w-full py-4 rounded-full bg-gold hover:bg-gold-hover text-dark font-black tracking-wider text-sm uppercase text-center transition-all duration-300 shadow-xl shadow-gold/25 glow-gold-btn"
      >
        Apply for Membership
      </button>
      <p class="text-center text-[10px] text-gray-600 font-inter tracking-widest uppercase">Limited June Slots Available</p>
    </div>

    <!-- Social Links -->
    <div class="flex items-center justify-center gap-6 mt-8">
      <a href="#" aria-label="Instagram" class="w-10 h-10 rounded-full bg-white/5 hover:bg-gold/10 hover:text-gold text-gray-500 flex items-center justify-center transition-all duration-300">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37zM17.5 6.5h.01"/>
        </svg>
      </a>
      <a href="#" aria-label="YouTube" class="w-10 h-10 rounded-full bg-white/5 hover:bg-gold/10 hover:text-gold text-gray-500 flex items-center justify-center transition-all duration-300">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M22.54 6.42a2.78 2.78 0 00-1.95-1.96C18.88 4 12 4 12 4s-6.88 0-8.59.46a2.78 2.78 0 00-1.95 1.96A29 29 0 001 12a29 29 0 00.46 5.58 2.78 2.78 0 001.95 1.96C5.12 20 12 20 12 20s6.88 0 8.59-.46a2.78 2.78 0 001.95-1.96A29 29 0 0023 12a29 29 0 00-.46-5.58z"/>
          <polygon points="9.75 15.02 15.5 12 9.75 8.98 9.75 15.02" fill="currentColor"/>
        </svg>
      </a>
      <a href="#" aria-label="X / Twitter" class="w-10 h-10 rounded-full bg-white/5 hover:bg-gold/10 hover:text-gold text-gray-500 flex items-center justify-center transition-all duration-300">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
          <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
        </svg>
      </a>
    </div>
  </div>
</div>
