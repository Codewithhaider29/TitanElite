<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Titan Elite | Premium Fitness Sanctuary & High-Science Athletic Training</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Google JSON-LD Structured Data: LocalBusiness Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsActivityLocation",
        "name": "Titan Elite Premium Fitness Sanctuary",
        "image": "https://titanelite.com/images/hero-bg.png",
        "@id": "https://titanelite.com/#organization",
        "url": "https://titanelite.com",
        "telephone": "+1-800-TITAN-VIP",
        "priceRange": "$$$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "77 Ritz-Carlton Boulevard, Suite 500, VIP Wing",
          "addressLocality": "Metropolis",
          "addressRegion": "NY",
          "postalCode": "10001",
          "addressCountry": "US"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 40.7128,
          "longitude": -74.0060
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "00:00",
          "closes": "23:59"
        }
      }
    </script>

    <!-- Google JSON-LD Structured Data: FAQPage Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Who is eligible for a Titan Elite membership?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "We cater to executive athletes, professional competitors, and high-achievers looking to optimize their lifestyle. Complete beginners are absolutely welcome—our sports science master coaches personalize physical baselines for all starting points."
            }
          },
          {
            "@type": "Question",
            "name": "What is included in the metabolic profiling assessment?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Our diagnostic profiles include 3D joint-load posture gait scans, resting calorimetry metabolic rate analysis, VO2 Max target heart rate zone assessments, and optional clinical biomarker reviews overseen by our nutrition team."
            }
          },
          {
            "@type": "Question",
            "name": "Can I freeze or cancel my protocol plan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. VIP and Olympic protocol plans offer unlimited seasonal freezes to accommodate business travel or competitive schedules. Standard membership cancellations require a simple 30-day notice filed directly with your private concierge."
            }
          },
          {
            "@type": "Question",
            "name": "Is there a guest policy for the VIP coworking lounges?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes. VIP Elite and Olympic Protocol tiers receive 2 private guest lounge passes monthly for clients or business partners. Titan Club members have dedicated single-access privileges with optional guest upgrade passes."
            }
          }
        ]
      }
    </script>
  </head>
  <body style="background-color: #121212;">
    <!-- True Global Loader (Shows instantly before Angular bundles load) -->
    <div id="global-loader" style="position: fixed; inset: 0; z-index: 99999; background: #121212; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity 0.8s ease-in-out;">
      <div style="text-align: center; font-family: 'Outfit', sans-serif;">
        <span style="font-size: 2.25rem; font-weight: 900; letter-spacing: 0.1em; color: white;">
          TITAN<span style="color: #FFD700; text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);">ELITE</span>
        </span>
        
        <div style="width: 200px; height: 2px; background: rgba(255,255,255,0.1); border-radius: 999px; margin: 24px auto 16px auto; overflow: hidden; position: relative;">
          <!-- Inline CSS animation for marquee line -->
          <style>
            @keyframes load-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
            @keyframes pulse-text { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
          </style>
          <div style="height: 100%; width: 50%; background: #FFD700; border-radius: 999px; animation: load-sweep 1.5s linear infinite;"></div>
        </div>
        
        <span style="font-size: 10px; font-weight: bold; letter-spacing: 0.1em; color: #888; text-transform: uppercase; font-family: 'Inter', sans-serif; animation: pulse-text 2s infinite;">
          Initializing Protocol...
        </span>
      </div>
    </div>

    <app-root></app-root>
  </body>
</html>
